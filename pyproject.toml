[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "muse-realtime-bridge"
version = "0.1.0"
description = "Authenticated audio WebSocket bridge to OpenAI Realtime, for a Muse VM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["openai[realtime]>=2.0,<3", "websockets>=15,<16", "python-dotenv>=1,<2"]

[project.scripts]
muse-realtime-bridge = "muse_realtime_bridge.__main__:main"
muse-realtime-smoke = "muse_realtime_bridge.smoke:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
